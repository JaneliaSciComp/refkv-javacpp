[workspace]
authors = ["Mark Kittisopikul <kittisopikulm@janelia.hhmi.org>"]
channels = ["conda-forge"]
name = "refkv-javacpp"
platforms = ["osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
# the C ABI over refkv's Rust core: capi/target/release/librefkv_capi.* and capi/include/refkv.h
capi = { cmd = "cargo build --release --manifest-path capi/Cargo.toml", description = "Build the C ABI shim and its header" }
capi-test = { cmd = "cargo test --release --manifest-path capi/Cargo.toml", description = "Test the C ABI shim's pure functions (file: URL mapping, file pins)" }
# the JavaCPP parser: capi/include/refkv.h -> java/src/main/java/org/refkv/javacpp/global/refkv.java (committed)
java-gen = { cmd = "mkdir -p target/presets && javac -cp target/deps/javacpp-1.5.14.jar -d target/presets src/main/java/org/refkv/javacpp/RefkvPresets.java && java -jar target/deps/javacpp-1.5.14.jar -nocompile -cp target/presets -d src/main/java -Dplatform.includepath=$PWD/../capi/include org.refkv.javacpp.RefkvPresets", cwd = "java", depends-on = ["capi", "java-deps"], description = "Regenerate the raw JavaCPP bindings from the header" }
java-deps = { cmd = "mvn -q -B dependency:copy-dependencies -DoutputDirectory=target/deps", cwd = "java" }
java-build = { cmd = "mvn -B -q package -DskipTests", cwd = "java", depends-on = ["capi"], description = "Compile the bindings and build the JNI library" }
# the BigDataViewer demo: `pixi run demo` opens the demo image; options go in one quoted argument, for example
# `pixi run demo "--check"`, `pixi run demo "--preview docs/preview.png"`, or `pixi run demo "path/or/url/of/an/image --out my.vzip"`
demo-install = { cmd = "mvn -B -q -f java/pom.xml install -DskipTests", depends-on = ["capi"], description = "Install the bindings where the demo finds them" }
demo = { cmd = "mvn -B -q -f demo/pom.xml compile exec:exec -Dexec.executable=java -Dexec.workingdir=$PIXI_PROJECT_ROOT -Dexec.args=\"--enable-native-access=ALL-UNNAMED -cp %classpath org.refkv.demo.BdvDemo {{ options }}\"", args = [{ arg = "options", default = "" }], depends-on = ["demo-install"], description = "Open an image in BigDataViewer through a refkv vzip archive" }
test = { cmd = "mvn -B test", cwd = "java", depends-on = ["capi"], description = "Run the Java tests" }

[dependencies]
openjdk = "21.*"
maven = ">=3.10.0,<4"
cmake = ">=4.4.5,<5"
clangxx = ">=23.1.5,<24"
git = ">=2.56.1,<3"
rust = ">=1.99.1,<1.100"
blosc = ">=1.21.7,<2"

# jblosc (which n5-blosc uses) bundles no Blosc: it asks JNA to load libblosc, which the blosc package above provides in the
# environment's lib directory. JNA only looks in its own library path, so tell it where; every JVM started in this environment,
# Maven's forked test JVMs included, picks the flag up. On Windows the DLL is in Library\bin instead: not set here.
[target.osx-arm64.activation.env]
JAVA_TOOL_OPTIONS = "-Djna.library.path=$CONDA_PREFIX/lib"
